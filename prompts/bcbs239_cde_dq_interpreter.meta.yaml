name: bcbs239_cde_dq_interpreter
purpose: >
  Step 2 of the BCBS 239 pipeline. Pure interpretation: read the regulation and
  identify Critical Data Element candidates and the data quality monitoring they
  require. Reads nothing from the catalog and creates nothing.

target_agent: bcbs239_cde_dq_interpreter

model:
  provider: bedrock
  name: claude-sonnet-4-6
  region: us-east-1

# Empty by design. The prompt body is a system prompt with NO template
# variables, so the file on disk is byte-identical to what Agent Studio holds —
# which is what makes local testing meaningful. Agent Studio has no templating,
# so any {{ var }} left in the body would reach the model as literal text.
deploy_variables: {}

# Markdown, not JSON. The output is for human review while the interpretation
# itself is what's being judged. Do NOT set an output_json_schema on the agent —
# it would fight the prompt's format instructions. When this output eventually
# feeds step 3 (catalog matching), that's when JSON earns its place, and the
# prompt changes at the same time.
output:
  format: markdown
  schema: null

input_contract:
  mechanism: input_parameter
  parameter: message
  type: string
  produced_by: scripts/extract_bcbs239.py -> artifacts/bcbs239/bank_principles.txt
  chunking: none — all bank-facing principles (1-11) together, ~6.5k tokens
  rationale: >
    CDEs are cross-cutting, so the model needs P2, P3, P4 and P7 in view at once.
    Sending one principle at a time produces disconnected lists.

agent_config:
  tools: []          # deliberately none — pure interpretation, nothing to look up
  mode: tool_call

changelog:
  - version: 0.1.0
    date: 2026-08-24
    note: >
      Initial version. The load-bearing parts are the four CDE inclusion tests
      (which stop the model listing every field a bank owns) and the required
      out-of-scope section naming P8-P11. Revise those before touching tone.
  - version: 0.2.0
    date: 2026-08-24
    note: >
      Response to an 8-run stability baseline of 33% (see
      docs/bcbs239-interpretation-review.md). Four changes, each tied to a
      measured failure:
        1. Required coverage of 8 named categories, count fixed at 10-12. The
           set was previously free-floating, so each run picked a different 12
           from a larger pool.
        2. Explicit criticality rubric (3 = invalidates a figure, 2 = degrades a
           dimension, 1 = supporting context) with an expected 3-5 threes.
           Risk classification had been swinging 2/3 across identical runs.
        3. Reconciliation key and lineage/provenance called out as mandatory
           categories. Both were the strongest paragraph-36 arguments in run 1
           and had fallen to 1/8 and 3/8 respectively.
        4. Sections 3 and 4 declared mandatory, with at least two cross-cutting
           requirements. 3 of 8 runs had omitted cross-cutting entirely.
      Also resolves the driver/out-of-scope contradiction: a principle may
      appear in both, but the split must be stated.
      Measure with: python3 scripts/compare_runs.py docs/runs/*.md
  - version: 0.3.0
    date: 2026-08-24
    note: >
      v0.2.0 lifted stability from 33% to 77% (and to 100% on the required
      categories), and eliminated all unstable criticality-3 elements. This
      version addresses the one thing it did not fix: criticality ratings still
      drifted between identical runs (risk classification 2 in 3 of 9 runs,
      exposure amount 2 in 1 of 9), threes ran hot at 5-6 against a stated 3-5,
      and level 1 was never used at all.
      Change: replace the descriptive rubric with a decision PROCEDURE —
      default everything to 2, promote to 3 only if the sentence "without this,
      aggregate figure X cannot be computed at all, because ..." can be
      completed concretely, demote to 1 if no figure is affected. Target
      tightened to exactly 4-5 threes, and the model is told to expect
      run-to-run consistency explicitly.
      Hypothesis being tested: drift came from the rubric describing categories
      without saying how to decide, so each run re-derived the boundary. If
      ratings are still unstable after this, the next move is to stop asking for
      a numeric rating at all and ask only "load-bearing: yes/no".

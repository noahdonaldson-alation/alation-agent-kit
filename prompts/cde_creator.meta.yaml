name: cde_creator
purpose: >
  Drafts Critical Data Elements in CDM from chat, with a human approving before
  any write. Per element: create with its published overlay standard attached,
  then trigger Alation's own physical-column discovery.

  This is demo-script scene 5, and the second write on the demo path in the UI
  (after policy_creator). It is also where the Governed pillar becomes visible:
  a policy derives a standard, the standard attaches to an element, and Alation
  finds that element's columns in the warehouse without anyone asserting a link.

target_agent: cde_creator

model:
  provider: bedrock
  name: claude-sonnet-4-6
  region: us-east-1
  # Sonnet, for the same reason as policy_creator: the agent WRITES the CDE
  # description, and the description is what Alation generates search synonyms
  # from. Prose quality has a measured downstream effect on how many physical
  # columns are discovered, so this is not pure orchestration.

deploy_variables: {}

output:
  format: markdown
  schema: null
  # A results table read by a human in chat — name, id, risk level, job id.
  # Not machine-consumed.

input_contract:
  mechanism: input_parameter
  parameter: message
  type: string
  produced_by: >
    A human, in chat. Typically the policies and published standards created
    earlier in the demo, plus the data source key to scope discovery to.

agent_config:
  mode: tool_call
  tools:
    # Alation BASE tools. Search Catalog with object_types ["column"] is how the
    # agent finds physical columns — it returns business title, physical name,
    # type, containing table AND the numeric object id (verified 2026-09-03:
    # POST_DT came back as column id 4406). Get Object Fields resolves an
    # ambiguous hit. Note the naming seam: search calls these `column`, while a
    # PDE source_key says `alation://attribute/<id>` — same object.
    - Search Catalog
    - Get Object Fields
    # Alation BASE tool, not ours — richer than the one I started to write, and
    # it meters at 0.25 ACU per call where a custom tool would not. Two defaults
    # in it are traps the prompt has to work around: `limit` defaults to 10, and
    # CDEs are versioned so `latest_only` must be set or one element returns as
    # several. It also offers `search` (free text over name AND description),
    # which is a better duplicate check than listing and string-matching.
    - List Critical Data Elements    # duplicate check before creating
    - Fetch CDE Overlay Standards    # resolve a standard name to its UUID key
    - Create Critical Data Element   # standard + columns attached in one call
    # Discover CDE Columns was REMOVED in v0.2.0 — see the changelog.

changelog:
  - version: 0.3.5
    date: 2026-09-08
    note: >
      TRUST FLAGS ARE NOW CHECKED BEFORE A COLUMN IS ATTACHED, ranked above the
      every-layer instruction. This is the real fix for the 5/5 failure recorded
      in 0.3.4, and it replaces the prose rule that was tried and reverted there.

      The agent gains a seventh tool, `Fetch Trust Flags`
      (`tools/fetch_trust_flags.json`). DEPRECATION excludes and the reason is
      quoted to the human; WARNING is surfaced but does not veto; ENDORSEMENT is
      treated as evidence for the control_point choice rather than mere
      permission. Explicitly stated: an unflagged object is NOT thereby endorsed
      — most objects carry no flags, so silence means unjudged, not approved.

      WHY THIS SHAPE RATHER THAN A TABLE LIST. Noah's call, and it is right: a
      catalogue's whole purpose is structured metadata, so a governance rule
      should read a typed field with a mandatory reason, not have a model infer
      intent from a sentence someone may or may not have written. The reverted
      prose version had ALSO passed its validation run — while excluding on the
      `tmp_` name prefix rather than on any declaration, which would have missed
      a retired table that happened to be named conventionally.

      NO TENANT SPECIFICS IN THE PROMPT. The rule is general and the whole change
      belongs on origin; every customer warehouse has retired copies.

      TWO MECHANICS THE PROMPT HAS TO STATE, both measured rather than assumed:
      the tool takes the CONTAINING TABLE's id while Search Catalog returns
      COLUMN ids, so the agent must resolve the table first — one extra call per
      candidate table; and `include_propagated` defaults to false, so a schema
      deprecated as a whole is invisible on its tables unless it is sent true.

      UNVERIFIED AT TIME OF WRITING: no run has exercised this. The prediction
      from 0.3.4 stands — do-not-use attachment 5/5 -> 0/5, control point holding
      at 5/5 on column 10196, element count untouched and handled by the invoking
      message. Note the test is only meaningful once the tables the runs actually
      reach for are flagged: on gartner2026 only `legacy.customer_exposure_2023`
      carries a DEPRECATION, and four of the five failing runs attached
      `finance.tmp_customer_exposure` instead.

  - version: 0.3.4
    date: 2026-09-08
    note: >
      REVERTED — THE PROMPT IS UNCHANGED FROM 0.3.3. This entry records a
      measurement worth keeping and a design that was tried and rejected, so
      nobody re-treads it.

      WHAT WAS TRIED: a prose-declaration rule — "exclude any table the catalogue
      declares unfit for reporting, and read the containing table's description,
      because the authoritative table often names the copies not to use." It
      passed its validation run: tmp_customer_exposure excluded, control point
      held at 10196.

      WHY IT WAS REVERTED ANYWAY, and Noah's call is right: it asks the agent to
      infer a governance rule from a sentence, in a product whose entire purpose
      is structured metadata. The validation run proved the objection — the agent
      excluded on the `tmp_` NAME PREFIX, not on any declaration. It never read
      the description. Right answer, wrong mechanism, and a name heuristic would
      not have caught `legacy.customer_exposure_2023`, which is the table the
      previous batch's Run 4 attached. A rule that passes for a reason other than
      the one it states is worse than a failing one, because the next tenant
      inherits the false confidence.

      THE RIGHT MECHANISM IS ALATION'S OWN TRUST FLAGS, not a description and not
      a custom field. `GET /integration/flag/?oid=<id>&otype=table` returns
      `flag_type` in {DEPRECATION, WARNING, ENDORSEMENT} with `flag_reason`
      MANDATORY on the first two — so the declaration is structured, the reason
      travels with it, and no prose parsing is involved. Flags exist at data
      source, schema, table AND column level, and `include_propagated=true`
      returns flags inherited from a parent (`is_propagated` distinguishes them),
      so deprecating a `legacy` schema once covers every table beneath it.
      Alation's own best-practice guidance names this exact use — "deprecate data
      sets that are being decommissioned", and link the preferred dataset in the
      reason.

      UNVERIFIED, and each needs checking before the prompt changes:
      (a) whether the base tool `Get Table Trust Flags` (c8ceef74 on
      gartner2026) wraps this endpoint and what it returns — `tool show
      "Get Table Trust Flags" --full`;
      (b) whether the OAuth bearer reaches `/integration/flag/`. The bearer is
      verified on `/integration/v1/` but this path has no `v1` segment, and the
      published doc shows only the legacy TOKEN header;
      (c) whether the tool is worth adding to this agent's tool list at 0.25 ACU
      per call per candidate table, versus a custom tool which does not meter.

      DEMO NOTE: the script's do-not-say list is right that trust flags are
      advisory — they warn, they do not block. That is an asset rather than a
      problem here. "Alation's deprecation flag is advisory by design; we made
      the agent treat it as binding" is true, is the Open pillar, and gives the
      red stoplight visible on the table page in Act 1 a payoff in Act 3.

      THE MEASUREMENT THAT STANDS, taken on gartner2026.mtse, N=5, one element
      (Risk-Weighted Assets) against published standard 283.

      THE FINDING: 5/5 runs attached a table the catalogue had declared do-not-use.
      Four attached `finance.tmp_customer_exposure`; the fifth excluded it on good
      reasoning (no medallion tag, no description, no steward) and then attached
      `legacy.customer_exposure_2023` instead, as "historical as-of date for
      prior-year reconciliation". So the exclusion instinct exists but was not
      pointed at governance status — the v0.2.2 medallion instruction ("do not
      exclude a bronze or silver column merely for being upstream") dominated, as
      written it should. Nothing outranked it. Now something does.

      WHY IT MATTERS BEYOND CORRECTNESS: on this tenant those two tables are named
      in the authoritative fact table's own description as copies not to use, and
      that sentence is Act 1's opening beat in the demo script. An agent attaching
      them mid-demo contradicts, on screen, a claim the room watched being made
      fifteen minutes earlier.

      PREDICTION, recorded before the change per prompt-iteration.md: do-not-use
      attachment goes 5/5 -> 0/5, control-point selection holds at 5/5, and the
      element-count drift is untouched. If attachment drops but the control point
      degrades, the rule is too blunt and should be narrowed to declared-status
      only.

      NOT FIXED HERE, deliberately — element count drifted 1/3/1/1/1. Run 2
      proposed three elements where the others proposed one, the same N=1
      instability recorded for policy_author (7 vs 6 on identical runs). Per the
      standing lesson the fix is to remove the question rather than instruct
      harder, so this belongs in the invoking message ("create one element for the
      RWA amount"), not in the prompt.

      ALSO NOT FIXED, and worth a run to characterise: Run 2 reported "Position
      date column not catalogued" as a genuine catalogue gap. `AS_OF_DATE` exists
      as column 10157 and three other runs found it. A confident false gap finding
      about a customer's warehouse is the most damaging output this agent can
      produce, and it is the same shape as the fabricated citations in v0.3.2 —
      a plausible artefact generated where a real one was not found.

      MEASURED POSITIVE, and it answers the open question this tenant existed to
      test: THE VOCABULARY TRANSFER WORKS. gartner2026 spells columns out in full
      (`RISK_WEIGHTED_ASSET_AMT`, `EXPOSURE_AT_DEFAULT`, `OUTSTANDING_BALANCE`,
      `AS_OF_DATE`) where this prompt's worked examples teach the abbreviated
      house style of finance-industry.mtse (`CPTY_ID`, `EXPOSURE_AMT`, RECON, GL,
      CPTY). All five runs found column 10196 anyway, and 5/5 chose it as the
      control point. Semantic judgement over search results carried a convention
      the prompt's examples actively argued against — which is the v0.2.0 bet
      (agent search beats lexical DATA_MAPPING) holding up on a warehouse nobody
      tuned it for. The examples were left unchanged: they did no measurable harm
      and rewriting them per tenant is the per-customer cost this kit exists to
      avoid.

      Duplicate check: 5/5 found the stranded CANDIDATE (id 19518), correctly
      explained that an existing CDE cannot have a standard or columns added to it
      by an agent, and recommended a steward retire it.

  - version: 0.3.3
    date: 2026-09-03
    note: >
      The no-count rule now applies everywhere, not just to the proposal. The
      v0.3.2 run opened with "Ten elements to create" and created nine — the
      SEVENTH confirmed instance of a model in this pipeline failing to total its
      own output, and the second in this agent. v0.2.1 had scoped the rule to
      step 5; the miscount simply moved to the creation commentary.

      Consistent with the standing finding: per-row work is flawless, summing
      across rows is not, and instruction does not fix it. So the fix is removing
      the question wherever it can be asked, rather than asking more firmly.

      VERIFIED IN THE SAME RUN: the citation fix works. Governing Standards now
      reads "BCBS239 - Risk Data Accuracy, Reconciliation and Authoritative
      Sourcing — Authoritative Source Designation and Risk Data Reconciliation to
      Accounting", naming standards and requirements with no fabricated paragraph
      numbers. Merge held (four standards on Position As-of Date), and the
      descriptions improved independently — distinguishing the VARCHAR staging
      form from the typed DATE, and naming the three obligations that break at
      once.

      Also of note, unprompted: the run reported that no RWA_AMT or
      risk-weighted-asset column exists in the data source, and said where that
      gap should be recorded if RWA lives elsewhere. Gap findings continue to
      arrive as a by-product of doing the work rather than from asking for them.

  - version: 0.3.2
    date: 2026-09-03
    note: >
      FABRICATED PARAGRAPH CITATIONS — caught in the UI on the first
      multi-standard run and fixed at the prompt.

      The `Position As-of Date` CDE's description read "BCBS 239 Principle 3
      (¶641) ... Principle 4 (¶658) ... Principle 5 (¶656) ... Principle 6
      (¶657 ¶50)". 641, 656, 657 and 658 are the STANDARD IDS we passed in. The
      agent rendered them in ¶ notation, citing paragraphs that do not exist —
      BCBS 239's paragraphs are two-digit. Only ¶50 was real.

      This is the same failure family as the one that drove the citation-pointer
      design in `policy_body_author`: a model asked to produce references
      produces plausible ones. There the fix was structural — the agent emits a
      pointer and code substitutes the exact text, so a quote cannot be
      untraceable by construction. Here there is no code step to substitute
      into, so the fix is a prohibition plus a removal of the need: name the
      standard and the requirement instead of a paragraph. "BCBS239 - Risk Data
      Timeliness, Availability SLA" is precise and checkable and needs no ¶.

      The tell is worth remembering: a three-digit number after ¶ in this
      pipeline is always a database id wearing a citation's clothes.

      VERIFIED IN THE SAME RUN, and it is the thing this version existed for:
      merge works. `Position As-of Date` carries four BCBS 239 standards plus
      Baseline Metadata and Risk Assessment Framework, with three AS_OF_DATE
      columns across bronze, silver and gold, each showing its source path. One
      column, four principles, in one screen.

  - version: 0.3.1
    date: 2026-09-03
    note: >
      Placeholder-name guard. A standard whose current version is called `Test 3`,
      `Untitled`, `Copy of…` or similar — or whose name bears no relation to its
      source policy — is now flagged and the agent STOPS and asks.

      IT ASKS RATHER THAN SKIPS, deliberately. Noah's instinct was a rule to
      ignore anything with TEST in the name. Right in general, but on this
      instance it would disable the feature it was protecting: `Test 1`..`Test 6`
      ARE the current published versions of six of the seven BCBS 239 standards,
      so a skip rule leaves the agent with one standard and no multi-standard
      build. And a silent skip is the worse failure mode anyway — a dropped
      standard means elements quietly under-covered with no one the wiser, where
      an ugly name is at least visible. Both choices belong to the human.

      Also: when told to proceed, the agent must refer to such a standard by its
      SOURCE POLICY thereafter, so a proposal never claims an element is governed
      by "Test 3".

      Correction carried over from the same conversation: CDEs are not as
      disposable as earlier notes here implied. Drafts delete freely (done
      repeatedly on 2026-09-03), but a CERTIFIED CDE is version-only, the same
      one-way door as a published standard — confirmed by Noah against a second
      tenant. Reasoning that leans on "we can always recreate the CDEs" only
      holds while they are drafts.

  - version: 0.3.0
    date: 2026-09-03
    note: >
      MULTI-STANDARD. The agent now reads every standard governing the regulation
      at once and attaches all applicable ones per element, instead of working
      from a single standard.

      THIS IS FORCED, NOT PREFERRED. `fields` can only be set at create time and
      there is no agent-reachable way to attach a standard afterwards. A single
      element usually evidences several principles — an exposure amount is
      governed by accuracy AND completeness AND timeliness — so building from one
      standard permanently precludes the others. Processing standards
      sequentially cannot work across a full regulation. Noah's call, and the
      constraint makes it the only correct one.

      It is also the better demo: one element visibly governed by several
      principles is the Governed pillar in a single screen.

      MATCHING MOVED FROM NAME TO SOURCE POLICY. Each standard carries
      `sources[]` with `alation://business_policy/<id>`, which is stable; its own
      name is not, because renaming creates a new version. On this instance six
      of the seven BCBS 239 standards have a version 2 named `Test 1`..`Test 6`,
      so a name match finds the superseded v1 or nothing at all. Grouping by
      source policy routes around that entirely — which is why the Test standards
      are NOT being renamed. Noah's call, and it is right: the rename would not
      remove the old versions anyway, and matching on something stable is
      correct regardless of what those versions happen to be called. Residual
      cost is cosmetic and stated in the prompt: `Test 4` will display on any CDE
      that attaches it, and the agent is told to flag when a version's name looks
      unrelated to its source policy.

      Version selection: among rows sharing a `key`, take the highest `version`
      with status PUBLISHED. Drafts are not applied by CDM, so an unpublished
      standard is left out with a note rather than attached.

      VERIFIED THIS VERSION: `Fetch CDE Overlay Standard Detail` works. A run
      against standard 641 read all four derived requirements by name and then
      correctly refused to make CDEs out of Reconciliation Frequency, Approved
      Accuracy Threshold, Business Data Owner, Measurement Frequency, Dictionary
      Entry Exists and Responsible Reviewer — it could see they were attestation
      fields inside the standard. So "the agent reads what CDM derived" is now
      mechanism rather than narration, and the v0.2.1 governance-metadata guard
      has something concrete to act on.

      UNVERIFIED: no multi-standard run has been executed, and nothing has yet
      confirmed whether attaching by `key` follows the standard's current version
      or pins whichever version was current at attach time. If it pins, a later
      standard revision will not reach existing CDEs.

  - version: 0.2.2
    date: 2026-09-03
    note: >
      `path` added to the PDE shape and proven. It is what CDE Manager renders in
      its `Source path` column — omit it and every row reads N/A; send it and you
      get "MCF Snowflake > mcf_risk_silver > exposure_clean". The `type`
      vocabulary data/schema/table was inferred from the breadcrumb's shape (the
      spec's only example value is `data`) and confirmed by a live create.

      This matters more than it looks. Four SOURCE_SYSTEM_CD columns from four
      tables are four indistinguishable rows without it, and the steward review
      the whole design rests on becomes guesswork.

      VALIDATED END TO END on six CDEs (19569-19574), 22 columns, one create call
      each carrying standard + columns + paths.

      Also worth recording: the run that produced them read the POLICY prose, not
      the standard's derived_requirements — it tried, concluded the tool was not
      returning them, and fell back. That works, but it is one step up the chain
      from the demo's claim that the agent reads what CDM derived. Open item
      against `Fetch CDE Overlay Standards`.

  - version: 0.2.1
    date: 2026-09-03
    note: >
      Three fixes, all from one bad run that produced a plausible-looking
      proposal with nothing behind it.

      IT SKIPPED THE SEARCH. The run proposed seven elements with "Physical
      analogue: RDE_ID, ELEMENT_ID, SRC_ELEMENT_ID" — guessed names, no ids, no
      tables, no tool calls. Step 4 existed but was one line in a long list, and
      the model went from deriving elements straight to presenting them. Now the
      step says explicitly that it precedes the proposal, and names the failure
      by its symptom: if you are writing "physical analogue" you have skipped it.
      Guessed names are worth nothing here because `source_key` needs an id only
      a search returns.

      IT DRIFTED INTO GOVERNANCE METADATA. It proposed "Data Accuracy Rate" and
      "Accuracy Threshold Value" as CDEs. Those are attestations the overlay
      standard already captures as requirement fields — not business data
      elements — and an earlier run had correctly identified them as catalog
      GAPS. Creating them would produce elements permanently without columns,
      since attach is create-only. Added a definition of what a CDE is
      (column-shaped, lives in the data) and the counter-test: could this appear
      in a risk warehouse table alongside the position it describes?

      IT MISCOUNTED ITSELF — "I've derived six elements" above a list of seven.
      Sixth confirmed occurrence of a model in this pipeline failing to total its
      own output, and per the standing lesson the fix is to remove the question
      rather than instruct harder: the prompt now forbids stating a total at all.
      The numbered list is the count, and it cannot disagree with itself.

  - version: 0.2.0
    date: 2026-09-03
    note: >
      THE AGENT NOW FINDS THE COLUMNS ITSELF. `Discover CDE Columns` is gone and
      `pdes` is sent on create. This reverses v0.1.0's central design choice, on
      a measurement.

      WHAT KILLED THE OLD DESIGN. v0.1.0 leaned on CDM's DATA_MAPPING: write a
      good description, CDM generates search synonyms from it, discovery matches
      those against column names. Run live on seven CDEs, every single trigger
      returned "the synonym generator found no matchable keywords from the
      description". Synonym generation is not part of API create — it is
      something the UI does. So the whole discovery path was dead for
      agent-created elements, and the demo's best beat ("write a good definition
      and Alation finds the columns") did not survive contact.

      WHY THE REPLACEMENT IS BETTER, NOT JUST AVAILABLE. DATA_MAPPING matches
      LEXICALLY on column-name tokens — measured 2026-08-31, "gross exposure"
      finds nothing while "exposure amount" finds EXPOSURE_AMT. An agent reading
      Search Catalog results does semantic matching over the business title, the
      physical name, the data type AND the containing table, so it can do what
      the lexical matcher provably could not, and can say WHY each column
      matched. Curation Automation has already written descriptions across the
      instance, so there is real material to read.

      HONEST COST: PDE discovery moves out of the "Alation derives it" column and
      into ours. The demo can no longer claim the product found the columns
      unaided. It can claim something truer — an agent read the catalog and
      proposed the columns, and a steward accepts them. `relationship:
      "suggested"` is what keeps that claim honest; `related` would assert links
      the agent is not entitled to assert.

      ATTACHING IS ONE-SHOT, AND THAT IS FORCED. POST /cde/{id}/pde/ takes a BARE
      ARRAY of PDEData, so an HTTP tool cannot call it — the same wall that made
      business-policy creation unreachable. pde/update/ is a bare array too, and
      pde/accept/ takes no body at all (it appears to accept every suggestion at
      once, so it cannot accept a chosen subset either). Verified from the
      OpenAPI specs. So `pdes` on create is the only agent-reachable path,
      exactly as with `fields`, and the prompt leads with that constraint because
      getting it wrong is unrecoverable.

      Note this makes CLAUDE.md's "do NOT send pdes[] on create" obsolete. That
      was a design decision (let CDM discover them), not an API limitation, and
      the decision no longer holds.

      COLUMN IDENTIFICATION: source_key is alation://attribute/<id>, and the id
      comes from Search Catalog with object_types ["column"] — verified by
      POST_DT returning 4406. The `column`/`attribute` naming seam is a real trap
      and is called out in both the tool schema and the prompt.

      UNVERIFIED: no create carrying `pdes` has been executed. The source_key
      format is inferred from the spec's worked examples
      ("alation://attribute/123") plus a live column id, which is exactly the
      shape of inference this project has been wrong about before — reading a
      spec establishes what is forbidden, never what is allowed. First create is
      the test.

  - version: 0.1.0
    date: 2026-09-03
    note: >
      New agent. Replaces `agentkit cde apply` / `cde map` on the demo path;
      cdes.py becomes setup and reset rather than the thing a customer watches.

      WHY IT CAN EXIST. Unblocked 2026-08-31 by proving the OAuth bearer alone
      reaches /cde-service/: an empty POST to /standard/ returned 400 "Standard
      name cannot be empty" — authenticated, reached the handler, failed only on
      content — and a create then returned 201 with CDE 19558. So an HTTP tool
      does not need the CDEToken two-call exchange, which it could never have
      performed.

      THE DESCRIPTION IS THE PRODUCT, and it is why the prompt opens with it
      rather than with mechanics. CDM generates the element's search synonyms
      from its description, and DATA_MAPPING matches those synonyms LEXICALLY
      against column-name tokens — measured 2026-08-31, not assumed. "gross
      exposure" finds nothing; "exposure amount" finds EXPOSURE_AMT. A
      description written in pure business abstraction produces synonyms that
      match no column, and the element cannot be evidenced at all.

      KEYWORDS ARE NOT PASSED, deliberately, and Discover CDE Columns does not
      declare them. Supplying payload.keywords REPLACES CDM's generated set, and
      CDM's are better: on the GL reconciliation key our register's business
      vocabulary found nothing while CDM's own set contained `recon key` and
      `GL key`. Leaving them out is what makes the demo claim true — write a good
      definition and Alation finds the columns.

      `fields` IS SENT ON CREATE, and that is a correction to an earlier
      position. A CDE created without a standard lands PARKED MID-WIZARD at
      "Standards Assignment" — created, but unusable until a human finishes it by
      hand. Observed in the UI 2026-09-03. Attaching on create is what makes the
      element complete in one call.

      NO ATTACH-AFTER-CREATE PATH EXISTS FOR AN AGENT. The UI reads a CDE's
      standards at GET /cde-service/cde/{uuid}/policies/ — note `policies`, since
      CDM standards are policy objects internally (type OVERLAY, PolicyStatus
      enum). That path has no /integration/ segment, addresses the CDE by UUID
      key rather than integer id, and authenticates by session cookie, so an HTTP
      tool cannot call it. Consequence: an element created without a standard
      cannot be repaired by this agent, which is why the prompt makes attaching
      mandatory rather than advisory.

      RISK LEVEL 3 includes reconciliation, not only computability. An
      unverifiable risk figure is not a compliant one under BCBS 239 P7, so the
      GL reconciliation key sits alongside the identifier, the amount and the
      as-of date. Without that clause a model reads "cannot be computed"
      literally and grades every reconciliation element down to 2.

      THE DUPLICATE CHECK IS A BASE TOOL, and the custom one written for it was
      deleted the same day. Deploying `tools/list_cdes.json` returned
      `400 "Unsupported tool type: default"` — the kit resolves tools by NAME,
      found Alation's built-in `List Critical Data Elements`, and aimed a PUT at
      it. `default` is the base-tool type and is not writable. The built-in is
      also better: it offers `search` over name and description, plus status,
      risk-level, steward and domain filters.
      That near-miss produced a guard in `agents.deploy_tool` — it now compares
      the existing tool's `tool_type` before writing and refuses on a mismatch,
      because the 400 was the server declining rather than the kit, and a base
      tool with a writable type would have been silently overwritten for every
      agent on the instance that references it.

      UNVERIFIED: the agent has not been deployed or run.

      Create Critical Data Element CANNOT be tested through `Test tool` while
      `fields` is declared: the form pre-fills every declared property including
      object arrays, always sending `fields: [{"key": ""}]`, and an empty string
      fails UUID parsing with a 422. There is no way to empty an object-array row
      in that form. Test it through the agent, which builds its own arguments.

      ORDERING is one element at a time, create then discover, because actions
      serialise per CDE and a concurrent trigger returns 409. Stop-on-first-
      failure for the same reason as policy_creator, with one addition the policy
      path does not need: a CDE can be created and then fail discovery, leaving a
      valid element with no columns. The prompt requires that state be reported
      by id rather than folded into "some succeeded".

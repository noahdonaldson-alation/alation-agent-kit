[project]
name = "alation-agent-kit"
version = "0.1.0"
description = "Git-backed development and deployment kit for Alation Agent Studio agents, tools, and prompts."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pypdf>=4.2",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
agentkit = "alation_agent_kit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
